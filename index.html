<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>椰子小超人银行</title>
<style>
  :root{
    color-scheme:light;
    --bg:#FFF7ED; --card:#FFFFFF; --ink:#3E2723; --sub:#8D6E63; --line:#F5E6D3;
    --blue:#3B82F6; --orange:#F97316; --green:#22C55E; --yellow:#EAB308; --red:#EF4444;
    --purple:#8B5CF6; --gold:#F59E0B; --gold2:#FBBF24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px;}
  .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 8px;}
  .tb-row{display:flex;align-items:center;gap:8px;}
  .topbar .logo{font-size:17px;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .tb-sub{display:flex;align-items:center;gap:8px;margin-top:7px;}
  .rolechip{white-space:nowrap;flex-shrink:0;}
  .fontbtn{display:block;width:100%;margin-top:10px;padding:11px;border:none;border-radius:12px;background:rgba(255,255,255,.9);color:#B45309;font-size:14px;font-weight:800;cursor:pointer;}
  .fontbtn:active{transform:scale(.97);}
  .modechip{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:800;}
  .modechip.server{background:#DCFCE7;color:#15803D;}
  .modechip.local{background:#FEF3C7;color:#B45309;}
  .top-btn{font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700;}
  .rolechip{font-size:12px;background:#EEF2FF;color:#4338CA;padding:4px 10px;border-radius:999px;font-weight:800;}
  .rolechip.admin{background:#FEF3C7;color:#B45309;}

  /* hero */
  .hero{background:linear-gradient(135deg,#FCD34D,#F59E0B);border-radius:24px;padding:18px 16px;margin:12px 12px 10px;color:#3E2723;box-shadow:0 8px 24px rgba(245,158,11,.28);position:relative;overflow:hidden;}
  .hero::after{content:"🏦";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:64px;opacity:.18;}
  .hero .title{font-size:14px;font-weight:800;opacity:.85;}
  .hero .big{font-size:46px;font-weight:900;line-height:1;margin-top:4px;}
  .hero .sub{font-size:12px;font-weight:700;margin-top:6px;opacity:.9;}
  .hero .progress{height:10px;background:rgba(255,255,255,.45);border-radius:999px;margin-top:10px;overflow:hidden;}
  .hero .progress i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s ease;}
  .hero .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:6px;opacity:.85;}

  /* dim strip（恢复：小卡片仅 图标+彩色分数） */
  .dim-strip{display:flex;gap:8px;padding:10px 12px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .dim-card{flex:0 0 auto;min-width:58px;background:#fff;border-radius:14px;padding:9px 8px 7px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);border:2px solid transparent;}
  .dim-card.on{border-color:currentColor;background:#FFF8F0;}
  .dim-card .e{font-size:22px;line-height:1;}
  .dim-card .v{font-size:20px;font-weight:900;margin-top:2px;}

  /* dim tabs（恢复：胶囊标签，选中深色） */
  .dim-tabs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .dim-tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;font-size:13px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .dim-tab.on{background:#1F2937;color:#fff;box-shadow:none;}
  .dim-tab .ic{font-size:15px;}

  /* 维度小节头（恢复） */
  .sec-head{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;}
  .sec-head .e{font-size:26px;line-height:1;}
  .sec-head .t{font-size:18px;font-weight:900;}
  .sec-head .s{font-size:11px;color:var(--sub);margin-top:1px;}

  /* 任务卡（与扣分页同款图文卡，.gcard 定义见 grid 区） */

  /* section title */
  .sec-title{display:flex;align-items:center;gap:8px;padding:14px 12px 8px;font-size:16px;font-weight:900;}
  .sec-title .dot{width:10px;height:10px;border-radius:4px;}

  /* grid cards */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px;}
  .gcard{background:var(--card);border-radius:18px;padding:12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:6px;min-height:100px;cursor:pointer;transition:transform .1s;}
  .gcard:active{transform:scale(.97);}
  .gcard .e{font-size:34px;text-align:center;}
  .gcard .n{font-size:13px;font-weight:800;line-height:1.25;}
  .gcard .tag{font-size:11px;font-weight:800;color:var(--green);background:#DCFCE7;padding:3px 8px;border-radius:999px;align-self:flex-start;}
.gcard .tag.red{color:var(--red);background:#FEE2E2;}
.gcard .tag.blue{color:#1D4ED8;background:#DBEAFE;}
.gcard .tag.gray{color:#6B7280;background:#F3F4F6;}
.gcard.faded{opacity:.55;}
.gcard .hint{font-size:10px;color:var(--sub);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

  /* views */
  .view{display:none;padding-bottom:20px;}
  .view.on{display:block;}

  /* kid view */
  .kid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px;margin-top:10px;}
  .kstat{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .kstat .v{font-size:20px;font-weight:900;}
  .kstat .l{font-size:11px;color:var(--sub);margin-top:2px;}
  .flame-box{background:#fff;border-radius:18px;padding:14px;margin:12px 12px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .flame-box .t{font-size:13px;font-weight:800;color:var(--red);}
  .flame-box .stars{font-size:28px;letter-spacing:2px;margin-top:6px;}
  .goal-list{padding:0 12px;}
  .goal-card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .goal-card .row{display:flex;align-items:center;gap:8px;}
  .goal-card .nm{flex:1;font-size:14px;font-weight:800;}
  .goal-card .cost{font-size:13px;font-weight:800;color:#16A34A;}
  .goal-card .bar{height:8px;background:#E5E7EB;border-radius:999px;overflow:hidden;margin-top:8px;}
  .goal-card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:999px;}
  .goal-card .btn{width:100%;margin-top:10px;padding:10px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;}
  .goal-card .btn:disabled{opacity:.5;background:#9CA3AF;}

  /* list view */
  .list{padding:0 12px;}
  .rec{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .rec .t{font-size:14px;font-weight:800;}
  .rec .d{font-size:12px;color:var(--sub);margin-top:3px;}
  .rec .op{font-size:11px;color:var(--sub);margin-top:4px;}
  .rec .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-top:6px;font-weight:700;}
  .tag.add{background:#DCFCE7;color:#15803D;}
  .tag.sub{background:#FEE2E2;color:#B91C1C;}
  .tag.pending{background:#FEF9C3;color:#A16207;}
  .rec .mini{margin-top:8px;display:flex;gap:8px;}
  .rec .mini button{flex:1;padding:8px;border:none;border-radius:10px;font-size:13px;font-weight:800;}
  .mini.ok{background:#DCFCE7;color:#15803D;}
  .mini.no{background:#FEE2E2;color:#B91C1C;}

  /* admin */
  .admin-card{background:#fff;border-radius:18px;padding:14px;margin:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .admin-card h4{margin:0 0 8px;font-size:15px;font-weight:900;}
  .admin-card p{margin:0 0 10px;font-size:12px;color:var(--sub);line-height:1.4;}
  .admin-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .nm{flex:1;font-size:13px;font-weight:700;}
  .admin-row button{padding:6px 10px;border-radius:10px;border:none;font-size:12px;font-weight:800;}

  /* guide */
  .guide-card{background:#fff;border-radius:20px;padding:16px;margin:12px 12px 0;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .guide-card h3{margin:0 0 10px;font-size:16px;color:#92400E;}
  .guide-card p{margin:0 0 10px;font-size:13px;line-height:1.6;color:#5D4037;}
  .guide-card .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#FCD34D;color:#78350F;font-size:12px;font-weight:900;margin-right:6px;}

  /* reminders */
  .remind-box{background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;padding:12px 14px;margin:0 12px 12px;}
  .remind-box h4{margin:0 0 8px;font-size:14px;color:#92400E;}
  .remind-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #FDE68A;}
  .remind-item:last-child{border-bottom:none;}
  .remind-item .nm{flex:1;font-size:13px;font-weight:700;}
  .remind-item button{padding:6px 10px;border:none;border-radius:8px;font-size:12px;font-weight:800;background:#F59E0B;color:#fff;}

  /* filter tabs */
  .filter-tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .filter-tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--sub);}
  .filter-tab.on{background:#FEF3C7;color:#B45309;border-color:#FCD34D;}

  /* rules */
  .rule-card{background:#fff;border-radius:16px;padding:14px;margin:0 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .rule-card h4{margin:0 0 8px;font-size:15px;font-weight:900;}
  .rule-item{padding:8px 0;border-bottom:1px dashed var(--line);}
  .rule-item:last-child{border-bottom:none;}
  .rule-item .nm{font-size:14px;font-weight:800;}
  .rule-item .meta{font-size:11px;color:var(--sub);margin-top:2px;}
  .rule-item .desc{font-size:12px;color:#5D4037;margin-top:2px;line-height:1.4;}

  /* nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:66px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--sub);text-decoration:none;}
  .nav a.on{color:var(--gold);font-weight:800;}
  .nav .ic{font-size:20px;line-height:1;}

  /* masks/sheets */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .mask.on{display:flex;}
  .sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;}
  .sheet h3{margin:0 0 4px;font-size:18px;}
  .sheet .desc{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.4;}
  .sheet .actions{display:flex;gap:10px;margin-top:10px;}
  .sheet .actions button{flex:1;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:800;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:#F1F5F9;color:var(--ink);}
  .btn-red{background:#DC2626;color:#fff;}
  .btn-gold{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#3E2723;}

  /* options */
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .opts button{flex:1;min-width:80px;padding:12px 6px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:800;color:var(--ink);}
  .opts button.sel{border-color:var(--blue);background:#EFF6FF;color:var(--blue);}
  .subrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .subrow .sl{font-size:13px;font-weight:700;flex:1;}
  .subrow .sopts button{padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:800;}
  .subrow .sopts button.sel{border-color:var(--orange);background:#FFF7ED;color:var(--orange);}
  .ropebox{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:12px;margin-bottom:12px;}
  .ropebox .ri{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .ropebox .ri label{font-size:13px;font-weight:700;flex:1;}
  .ropebox .ri input{width:110px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;text-align:center;}
  .qty{display:flex;align-items:center;gap:14px;margin:10px 0;}
  .qty button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;}
  .qty .n{font-size:22px;font-weight:900;min-width:34px;text-align:center;}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;margin-bottom:10px;resize:vertical;}
  .field:focus{outline:none;border-color:var(--blue);}

  /* login */
  .login{position:fixed;inset:0;background:linear-gradient(160deg,#F59E0B,#EF4444);z-index:70;display:flex;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .login .box{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto;}
  .login h2{margin:0 0 4px;text-align:center;font-size:22px;}
  .login .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px;}
  .accts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .accts button{padding:14px 6px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .accts button .r{font-size:10px;color:var(--sub);font-weight:600;}
  .accts button.on{border-color:var(--gold);background:#FFFBEB;}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px;}
  .pinpad button{padding:16px;border:1px solid var(--line);border-radius:14px;background:#F8FAFC;font-size:20px;font-weight:800;}
  .pinpad .del{color:var(--red);}
  .pinshow{display:flex;justify-content:center;gap:10px;margin:8px 0 4px;}
  .pinshow i{width:12px;height:12px;border-radius:50%;background:#E5E7EB;}
  .pinshow i.on{background:var(--gold);}
  .login .go{width:100%;padding:14px;border:none;border-radius:14px;background:var(--gold);color:#3E2723;font-size:16px;font-weight:900;}
  .login .hint{text-align:center;font-size:11px;color:var(--sub);margin-top:12px;line-height:1.5;}

  /* animations */
  @keyframes pop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .pop{animation:pop .35s ease;}
  @keyframes sparkle{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-40px) scale(0);opacity:0;}}
  .sparkle{position:fixed;font-size:20px;pointer-events:none;animation:sparkle .8s ease-out forwards;z-index:100;}
  .empty{text-align:center;color:var(--sub);padding:30px 12px;font-size:13px;}
  .hidden{display:none!important;}
  .banner{position:fixed;top:0;left:0;right:0;z-index:90;background:#DC2626;color:#fff;font-size:13px;padding:8px 14px;text-align:center;}
  .toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);background:rgba(31,41,55,.92);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tb-row">
      <div class="logo">🏝️ 椰子小超人银行</div>
      <div class="spacer"></div>
      <div class="rolechip" id="roleChip" onclick="openMenu()">—</div>
      <button class="top-btn" onclick="logout()">退出</button>
    </div>
    <div class="tb-sub">
      <span class="modechip local" id="modeChip">本地模式</span>
      <div class="spacer"></div>
      <button class="top-btn" id="refreshBtn" onclick="doRefresh()" title="刷新同步">🔄 刷新</button>
    </div>
  </div>

  <div class="view" id="view-score"></div>
  <div class="view" id="view-deduct"></div>
  <div class="view" id="view-exchange"></div>
  <div class="view" id="view-records"></div>
  <div class="view" id="view-kid"></div>
  <div class="view" id="view-admin"></div>
  <div class="view" id="view-guide"></div>
  <div class="view" id="view-rules"></div>
  <div class="view" id="view-guest"></div>

  <div class="nav" id="nav">
    <a data-v="score" onclick="navTo('score')"><span class="ic">☀️</span>加分</a>
    <a data-v="deduct" onclick="navTo('deduct')"><span class="ic">💧</span>扣分</a>
    <a data-v="exchange" onclick="navTo('exchange')"><span class="ic">🎁</span>兑换</a>
    <a data-v="records" onclick="navTo('records')"><span class="ic">📜</span>记录</a>
    <a data-v="kid" onclick="navTo('kid')"><span class="ic">🦸</span>宝宝</a>
    <a data-v="rules" onclick="navTo('rules')"><span class="ic">📋</span>规则</a>
    <a data-v="admin" id="navAdmin" onclick="navTo('admin')" class="hidden"><span class="ic">⚙️</span>管理</a>
  </div>
</div>

<!-- detail modal -->
<div class="mask" id="detailMask" onclick="closeDetail(event)">
  <div class="sheet">
    <h3 id="detName"></h3>
    <div class="desc" id="detDesc"></div>
    <div id="detBody"></div>
    <div class="actions" id="detActions"></div>
  </div>
</div>

<!-- score sheet -->
<div class="mask" id="scoreMask" onclick="closeSheet(event)">
  <div class="sheet">
    <h3 id="ssName"></h3>
    <div class="desc" id="ssDesc"></div>
    <div class="opts" id="ssOpt"></div>
    <div id="ssSubs"></div>
    <div class="ropebox hidden" id="ssRope">
      <div class="ri"><label>单次连续最高数量</label><input id="ssRopeCont" type="number" inputmode="numeric" placeholder="如 138"></div>
      <div class="ri"><label>1 分钟最高数量</label><input id="ssRopeOne" type="number" inputmode="numeric" placeholder="如 120"></div>
      <div class="hint" id="ssRopeHint"></div>
    </div>
    <div class="qty hidden" id="ssQty">
      <span style="font-size:13px;color:var(--sub);">数量：</span>
      <button onclick="chgQty(-1)">−</button>
      <span class="n" id="ssQtyN">1</span>
      <button onclick="chgQty(1)">＋</button>
      <span id="ssQtyHint" style="font-size:11px;color:var(--sub);"></span>
    </div>
    <input class="field" id="ssReason" placeholder="">
    <div class="actions">
      <button class="btn-ghost" onclick="closeSheet()">取消</button>
      <button class="btn-primary" id="ssSubmit" onclick="submitScore()">确认提交</button>
    </div>
  </div>
</div>

<!-- exchange sheet -->
<div class="mask" id="exMask" onclick="closeSheet(event)">
  <div class="sheet">
    <h3 id="exName"></h3>
    <div class="desc">需要 <b id="exCost"></b> 积分，当前可用 <b id="exBalance"></b> 积分</div>
    <input class="field" id="exReason" placeholder="想换这个奖励的原因（必填，孩子可以口述）">
    <div class="actions">
      <button class="btn-ghost" onclick="closeSheet()">取消</button>
      <button class="btn-gold" id="exSubmit" onclick="submitExchange()">确认申请</button>
    </div>
  </div>
</div>

<!-- deduct sheet -->
<div class="mask" id="deductMask" onclick="closeSheet(event)">
  <div class="sheet">
    <h3 id="deductName"></h3>
    <div class="desc">扣 <b id="deductScore"></b> 分；请认真填写原因</div>
    <input class="field" id="deductReason" placeholder="发生了什么？（必填，越具体越好）">
    <div class="actions">

/* ============ 北京时间（UTC+8）工具函数，避免服务器 UTC 导致显示差 8 小时 ============ */
function fmtNowCN(){
  const d=new Date();
  const parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t)?.value||'';
  return `${get('year')}/${get('month')}/${get('day')} ${get('hour')}:${get('minute')}:${get('second')}`;
}
function fmtTS(ts){
  if(!ts)return '';
  try{
    const d=new Date(ts);
    if(isNaN(d))return ts;
    return d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
  }catch(e){ return ts; }
}

/* ============ 本地存储（离线模式） ============ */
const Local = {
  // 内存兜底：隐私模式/受限浏览器禁用 localStorage 写入时，整个会话内仍可正常使用（仅重启后不保留）
  _memState:null, _memAccts:null, _memRules:null, _memAudit:null,
  loadState(){ try { const raw=localStorage.getItem(LS_STATE); if(raw===null&&this._memState) return this._memState; const s=JSON.parse(raw) || this.defaultState(); if(s.points && ('日常好习惯' in s.points)){ const pts={}; EMBED_RULES.dim.forEach(d=>pts[d.key]=0); for(const r of (s.records||[])){ if(r.status!=='confirmed') continue; const it=EMBED_RULES.items.find(i=>i.name===r.item); if(it&&pts[it.dim]!==undefined) pts[it.dim]+= (r.type==='sub'? -Math.abs(r.score): r.score); } s.points=pts; this.saveState(s); } return this.recalc(s); } catch(e){ return this._memState||this.defaultState(); } },
  saveState(s){ if(s) this.recalc(s); this._memState=s; try{ localStorage.setItem(LS_STATE, JSON.stringify(s)); }catch(e){} },
  // 分数唯一事实源：每次保存都从记录重算（已撤销/已驳回不计；兑换按预扣减），彻底杜绝"分数与记录对不上"
  recalc(st){ if(!st) return st;
    if(!Array.isArray(st.records)) st.records=[]; if(!Array.isArray(st.exchanges)) st.exchanges=[]; if(!Array.isArray(st.reminders)) st.reminders=[]; if(!st.points||typeof st.points!=='object') st.points={};
    const dims=(typeof RULES!=='undefined'&&RULES&&Array.isArray(RULES.dim))?RULES.dim:EMBED_RULES.dim;
    const pts={}; dims.forEach(d=>pts[d.key]=0); let total=0;
    for(const r of st.records){ if(r.status==='rejected'||r.void) continue; const t=r.type||'add';
      if(t==='add'&&r.status==='confirmed'){ pts[r.dim]=(pts[r.dim]||0)+r.score; total+=r.score; }
      else if(t==='sub'&&r.status==='confirmed'){ total+=r.score; } }
    for(const x of st.exchanges){ if(x.status!=='rejected') total-=x.cost; }
    st.points=pts; st.total=Math.max(0,total); return st; },
  loadAccts(){ try { const raw=localStorage.getItem(LS_ACCT); if(raw===null&&this._memAccts) return this._memAccts; return JSON.parse(raw) || null; } catch(e){ return this._memAccts||null; } },
  saveAccts(a){ this._memAccts=a; try{ localStorage.setItem(LS_ACCT, JSON.stringify(a)); }catch(e){} },
  // 计分卡配置本地持久化（管理员改卡后，关掉浏览器再打开仍然生效）
  loadRulesCfg(){ try { const r=JSON.parse(localStorage.getItem(LS_RULES)); if(r&&Array.isArray(r.dim)&&r.dim.length&&Array.isArray(r.items)&&r.items.length) return r; } catch(e){} return this._memRules||null; },
  saveRulesCfg(r){ this._memRules=r; try{ localStorage.setItem(LS_RULES, JSON.stringify(r)); }catch(e){} },
  loadAudit(){ try { const a=JSON.parse(localStorage.getItem(LS_AUDIT)); return Array.isArray(a)?a:[]; } catch(e){ return this._memAudit||[]; } },
  saveAudit(a){ this._memAudit=a; try{ localStorage.setItem(LS_AUDIT, JSON.stringify(a)); }catch(e){} },
  defaultState(){ return { points:{学习:0,运动:0,家务:0,自理:0,品格:0,勇气:0}, total:0, records:[], exchanges:[], reminders:[], carer:'爸妈' }; },
  parseCap(freq){ if(!freq) return null; let period=null,max=null;
    if(/每日1次|每餐1次|每课1次/.test(freq)){period='day';max=freq.includes('每餐')?3:1;}
    if(/日上限(\d+)/.test(freq)){period='day';max=parseInt(freq.match(/日上限(\d+)/)[1],10);}
    if(/每周(上限)?1次/.test(freq)){period='week';max=1;}
    if(/每周上限(\d+)/.test(freq)){period='week';max=parseInt(freq.match(/每周上限(\d+)/)[1],10);}
    return period?{period,max}:null; },
  usage(state, name, period){ const now=new Date();
    return state.records.filter(r=>{ if(r.item!==name||r.status==='rejected')return false; const d=new Date(r.ts);
      if(period==='day')return d.toDateString()===now.toDateString();
      const wd=x=>{const y=new Date(x);const day=(y.getDay()+6)%7;y.setDate(y.getDate()-day);return y.toDateString();};
      return wd(d)===wd(now); }).reduce((s,r)=>s+(r.qty||1),0); },
  usageScore(state, operatorName, period){ const now=new Date();
    return state.records.filter(r=>r.type==='add'&&r.status==='confirmed'&&r.operator===operatorName&&r.approver===operatorName&&(()=>{const d=new Date(r.ts); if(period==='day')return d.toDateString()===now.toDateString(); const wd=x=>{const y=new Date(x);const day=(y.getDay()+6)%7;y.setDate(y.getDate()-day);return y.toDateString();}; return wd(d)===wd(now);})()).reduce((s,r)=>s+r.score,0); },
  computeScore(item, b, state){
    if(item.special==='rope'){ let s=item.floor||2;
      const prev=[...state.records].reverse().find(r=>r.item===item.name&&r.status!=='rejected'&&r.remarks);
      if(prev&&prev.remarks){ if(Number(b.cont)>=Number(prev.remarks.cont))s+=1; if(Number(b.one)>=Number(prev.remarks.one))s+=1; }
      return Math.min(4,Math.max(item.floor||2,s)); }
    if(item.mode==='复合'){ const v=(b.subs||[]).map(Number); return item.subs.reduce((s,sub,i)=>s+(v[i]||0),0); }
    return Math.max(0,parseInt(b.score,10)||0); },
  handle(path, body){
    if(path==='/api/login'){ const a=ACCOUNTS.find(x=>x.name===body.name);
      if(!a||a.pin!==String(body.pin||'')) return {error:'账号或密码错误',_c:401};
      try{ localStorage.setItem(LS_USER,a.id); }catch(e){}
      return {token:a.id,name:a.name,role:a.role,id:a.id,directDims:a.directDims||[],canDeclare:!!a.canDeclare}; }
    if(path==='/api/guest'){ const st=this.loadState(); return {ok:true,rules:RULES,public:{points:st.points||{},total:st.total||0,carer:st.carer||'爸妈',recent:(st.records||[]).filter(r=>r.status==='confirmed').slice(0,20)}}; }
    const acc = ACCOUNTS.find(a=>a.id===ME.id);
    // 撤销记录（管理员）：软删除并回滚积分（本地模式）
    if(path==='/api/undo'){ if(acc.role!=='admin') return {error:'仅管理员可撤销',_c:403};
      const st=this.loadState(); const r=st.records.find(x=>x.id===body.recId);

      if(r.status==='confirmed'){
        if(r.type==='add'){ st.points[r.dim]=Math.max(0,(st.points[r.dim]||0)-r.score); st.total=Math.max(0,st.total-r.score); }
        else if(r.type==='sub'){ st.total=Math.max(0,st.total-r.score); }
      }
      r.void=true; r.voidBy=acc.name; r.voidAt=fmtNowCN();
      this.saveState(st); return {ok:true,state:st}; }
    if(path==='/api/mypin'){ const a=ACCOUNTS.find(x=>x.id===ME.id);
      if(!a||String(a.pin)!==String(body.oldPin||'')) return {error:'当前密码不正确',_c:400};
      const np=String(body.newPin||'');
      if(!/^\d{4,}$/.test(np)) return {error:'新密码需为至少 4 位数字',_c:400};
      if(np===String(a.pin)) return {error:'新密码不能与当前密码相同',_c:400};
      a.pin=np; this.saveAccts(ACCOUNTS); return {ok:true}; }
    if(path==='/api/state'){ return this.loadState(); }
    if(path==='/api/record'){ const st=this.loadState(); const item=RULES.items.find(i=>i.name===body.item);
      if(!item) return {error:'项目不存在',_c:400};
      const authorized = acc.role==='admin' || (acc.role==='elder'&&acc.canDeclare) || (acc.role==='elder'&&(acc.directDims||[]).includes(item.dim));
      if(!authorized) return {error:'当前账号未获申报/加分授权',_c:403};
      const qty=(item.special==='rope'||item.mode==='复合')?1:Math.max(1,parseInt(body.qty,10)||1);
      const cap=this.parseCap(item.freq);
      if(cap){ const used=this.usage(st,item.name,cap.period); if(used+qty>cap.max) return {error:`「${item.name}」${cap.period==='day'?'今日':'本周'}上限 ${cap.max}次，已用 ${used}次`,_c:400}; }
      const score=this.computeScore(item,body,st); const total=score*qty;
      let direct=acc.role==='admin'||(acc.role==='elder'&&(acc.directDims||[]).includes(item.dim));
      let notice='';
      // 外公外婆学习类直接加分：单笔≤3、日累计≤6；超出不禁止，自动降级为申报待爸妈确认
      if(acc.role==='elder'&&direct){
        const used=this.usageScore(st,acc.name,'day');
        if(total>3){ direct=false; notice=`本次 ${total} 分超过单笔 3 分上限，已转为申报，等爸妈确认后计分`; }
        else if(used+total>6){ direct=false; notice=`今日已直接加 ${used} 分，再加 ${total} 分会超过 6 分上限，已转为申报，等爸妈确认后计分`; }
      }
      const rec={id:Date.now()*1000+Math.floor(Math.random()*1000),ts:fmtNowCN(),dim:item.dim,item:item.name,score:total,qty,type:'add',reason:body.reason||'',operator:acc.name,status:direct?'confirmed':'pending',approver:direct?acc.name:'',remarks:item.special==='rope'?{cont:Number(body.cont)||0,one:Number(body.one)||0}:undefined};
      st.records.unshift(rec); if(direct){st.points[item.dim]+=total;st.total+=total;}
      st.reminders=st.reminders.filter(rm=>rm.item!==item.name); this.saveState(st);

    if(path==='/api/confirm'){ const st=this.loadState(); const r=st.records.find(x=>x.id===body.recId); if(!r)return{error:'记录不存在',_c:404};
      if(body.approve){ if(r.status!=='confirmed'){ r.status='confirmed'; r.approver=acc.name;

    if(path==='/api/exchange'){ const st=this.loadState(); if(st.total<body.cost)return{error:'积分不足',_c:400};
      const status=acc.role==='admin'?'approved':'pending';
      const ex={id:Date.now()*1000+Math.floor(Math.random()*1000),ts:fmtNowCN(),name:body.name,cost:body.cost,applicant:acc.name,status,approver:status==='approved'?acc.name:''};

    if(path==='/api/exchangeConfirm'){ const st=this.loadState(); const ex=st.exchanges.find(x=>x.id===body.recId); if(!ex)return{error:'兑换记录不存在',_c:404};
      if(body.approve){ if(ex.status!=='approved'){ ex.status='approved'; ex.approver=acc.name; } }
      else { if(ex.status!=='rejected'){ ex.status='rejected'; ex.approver=acc.name; st.total+=ex.cost; } }

    if(path==='/api/deduct'){ if(acc.role==='kid')return{error:'仅家长可登记扣分',_c:403};

      if(!body.reason||!body.reason.trim())return{error:'扣分必须填写原因',_c:400};
      const isAdmin=acc.role==='admin'; const st=this.loadState();
      const rec={id:Date.now()*1000+Math.floor(Math.random()*1000),ts:fmtNowCN(),dim:'扣分',item:d.name,score:d.score,qty:1,type:'sub',reason:body.reason.trim(),operator:acc.name,status:isAdmin?'confirmed':'pending',approver:isAdmin?acc.name:''};
      st.records.unshift(rec); if(isAdmin)st.total+=d.score; this.saveState(st); return {ok:true,status:rec.status}; }
    if(path==='/api/remind'){ const st=this.loadState();
      st.reminders.unshift({id:Date.now()*1000+Math.floor(Math.random()*1000),ts:fmtNowCN(),item:body.item,operator:acc.name,status:'pending'});
      this.saveState(st); return {ok:true}; }
    if(path==='/api/remindDismiss'){ if(acc.role==='kid')return{error:'仅家长可处理提醒',_c:403};
      const st=this.loadState(); st.reminders=st.reminders.filter(rm=>rm.id!==body.id); this.saveState(st); return {ok:true}; }
    if(path==='/api/carer'){ const st=this.loadState(); st.carer=body.carer; this.saveState(st); return {ok:true}; }
    if(path==='/api/account'){ const t=ACCOUNTS.find(x=>x.id===body.id); if(!t)return{error:'账号不存在',_c:404};
      if(body.directDims!==undefined)t.directDims=body.directDims; if(body.canDeclare!==undefined)t.canDeclare=!!body.canDeclare; if(body.pin!==undefined)t.pin=String(body.pin);
      this.saveAccts(ACCOUNTS); return {ok:true,accounts:ACCOUNTS.map(a=>({id:a.id,name:a.name,role:a.role,directDims:a.directDims||[],canDeclare:!!a.canDeclare}))}; }
    // 计分卡保存（管理员）：本地模式也持久化，关掉浏览器再打开仍生效
    if(path==='/api/rules/save'){ if(!acc||acc.role!=='admin') return {error:'仅管理员可编辑计分卡',_c:403};
      const nr=body.rules;
      if(!nr||!Array.isArray(nr.dim)||!Array.isArray(nr.items)) return {error:'计分卡格式不正确',_c:400};
      const keys=new Set(nr.dim.map(d=>d.key));
      for(const it of nr.items) if(!keys.has(it.dim)) return {error:'项目「'+(it.name||'')+'」所属维度不存在',_c:400};
      const before=JSON.stringify(RULES);
      // 合并而非整体替换：deduct（扣分卡）/exchange（兑换清单）等未编辑部分必须保留
      RULES=Object.assign({},RULES,nr);
      if(!Array.isArray(RULES.deduct)) RULES.deduct=JSON.parse(JSON.stringify(EMBED_RULES.deduct));
      if(!Array.isArray(RULES.exchange)) RULES.exchange=JSON.parse(JSON.stringify(EMBED_RULES.exchange));

      const au=this.loadAudit();
      au.unshift({ts:fmtNowCN(),actor:(acc&&acc.name)||'',action:'编辑计分卡',detail:before===JSON.stringify(RULES)?'未变化':'已更新计分卡配置'});
      this.saveAudit(au);
      return {ok:true}; }
    // 计分卡修改记录
    if(path==='/api/rules/log'){ if(!acc||acc.role!=='admin') return {error:'仅管理员可查看',_c:403}; return {ok:true,audit:this.loadAudit()}; }
    // 导出备份
    if(path==='/api/export'){ if(!acc||acc.role!=='admin') return {error:'仅管理员可导出数据',_c:403};
      return {ok:true,exportedAt:fmtNowCN(),state:this.loadState(),accounts:ACCOUNTS,rules:RULES,audit:this.loadAudit()}; }
    // 导入备份：密码以备份为准恢复，记录按 id 去重合并，再按确认记录重算总分
    if(path==='/api/import'){ if(!acc||acc.role!=='admin') return {error:'仅管理员可导入数据',_c:403};
      const s=body.state;
      if(!s||typeof s!=='object'||typeof s.total!=='number'||!s.points||!Array.isArray(s.records)) return {error:'备份文件格式不正确，请选择本系统导出的备份文件',_c:400};
      if(Array.isArray(body.accounts)){ for(const ba of body.accounts){ const t=ACCOUNTS.find(x=>x.id===ba.id); if(t){ t.pin=String(ba.pin); if(ba.directDims)t.directDims=ba.directDims; if(typeof ba.canDeclare==='boolean')t.canDeclare=ba.canDeclare; } } this.saveAccts(ACCOUNTS); }
      const st=this.loadState(); if(!Array.isArray(st.reminders))st.reminders=[]; if(!Array.isArray(st.exchanges))st.exchanges=[]; if(!st.carer)st.carer='爸妈';
      const existing=new Set(st.records.map(r=>r.id)); let added=0;
      for(const r of s.records) if(!existing.has(r.id)){ st.records.unshift(r); added++; }
      if(Array.isArray(s.exchanges)){ const exIds=new Set(st.exchanges.map(x=>x.id)); for(const x of s.exchanges) if(!exIds.has(x.id)) st.exchanges.unshift(x); }
      const pts={}; RULES.dim.forEach(d=>pts[d.key]=0); let total=0;
      for(const r of st.records){ if(r.status==='rejected'||r.void) continue; const t=r.type||'add';
        if(t==='add'&&r.status==='confirmed'){ pts[r.dim]=(pts[r.dim]||0)+r.score; total+=r.score; }
        else if(t==='sub'&&r.status==='confirmed'){ total+=r.score; } }
      st.points=pts; st.total=total; this.saveState(st);
      return {ok:true,total:st.total,records:st.records.length,added}; }
    return {error:'接口不存在',_c:404};
  }
};

/* ============ API 抽象层 ============ */
async function call(path, body){
  if(MODE==='server'){
    const opt={method:body?'POST':'GET',headers:{'Content-Type':'application/json'}};
    if(body) opt.body=JSON.stringify(Object.assign({token:ME&&ME.token},body));
    const r=await fetch(path+(path.includes('?')?'&':'?')+'token='+(ME?ME.token:''),opt);
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'请求失败');
    return d;
  } else {
    const res=Local.handle(path, body||{});
    if(res._c&&res._c>=400){ const e=new Error(res.error); e.resp=res; throw e; }
    return res;
  }
}
/* ============ 长辈大字模式（字体档位：标准 / 大 / 超大，记住选择） ============ */
const FONT_STEPS=[{k:'std',z:1,label:'标准'},{k:'big',z:1.2,label:'大'},{k:'xbig',z:1.4,label:'超大'}];
function curFont(){ try{ const v=localStorage.getItem('zfont'); return FONT_STEPS.find(x=>x.k===v)||FONT_STEPS[0]; }catch(e){ return FONT_STEPS[0]; } }
function applyFont(){
  const f=curFont();

function cycleFont(){

/* ============ 启动（全链路防摔：任何一步出错都不影响登录界面显示） ============ */
(async function init(){
  let restored=false;
  // —— 1) 联网检测：server 模式 or 本地模式 ——
  try {
    const ping = await fetch('/api/ping').then(r=>r.json());
    if(ping.ok && ping.mode==='server'){
      MODE='server'; RULES=await fetch('/api/rules').then(r=>r.json()); try { healRules(); } catch(_heal){}
      ACCOUNTS=ping.accounts.map(a=>({id:a.id,name:a.name,role:a.role,directDims:[],canDeclare:a.canDeclare}));
    } else throw new Error('not server');
  } catch(e){
    MODE='local';
    try {
      const la=Local.loadAccts();
      if(la && Array.isArray(la) && la.length>0 && la.every(a=>a&&a.id&&a.name&&a.role)){ ACCOUNTS=la; }
      else { ACCOUNTS=EMBED_ACCOUNTS.slice(); try{ Local.saveAccts(ACCOUNTS); }catch(_){} }
    } catch(_2){ ACCOUNTS=EMBED_ACCOUNTS.slice(); }
    try { RULES=Local.loadRulesCfg()||EMBED_RULES; } catch(_3){ RULES=EMBED_RULES; }
    try { healRules(); } catch(_3b){}
    try { showBanner('本地模式：数据仅存本机，换设备不共享。想全家同步请运行 server.js。'); } catch(_4){}
  }
  // —— 2) 顶栏状态（元素找不到也不许报错） ——
  try { const mc=document.getElementById('modeChip'); if(mc){ mc.textContent = MODE==='server'?'已联网·多端同步':'本地模式·未同步'; mc.className='modechip '+(MODE==='server'?'server':'local'); } } catch(_5){}
  try { const rb=document.getElementById('refreshBtn'); if(rb) rb.style.display = MODE==='server'?'':'none'; } catch(_6){}
  try { applyFont(); } catch(_7){}
  // —— 3) 登录态持久化：用本地保存的签名 token 自动恢复（后端重启后旧 token 仍有效） ——
  try {
    const saved = localStorage.getItem('zme');
    if (saved) { ME = JSON.parse(saved); await fetchState(); if (STATE && STATE.records) { afterLogin(); restored=true; } }
  } catch(e) { try { localStorage.removeItem('zme'); } catch(_8){} }
  // —— 4) 无论上面哪一步出过岔子，登录界面都必须拉起来 ——
  if(!restored){
    try { openLogin(); }
    catch(eL){ try { showBanner('登录界面加载异常：'+(eL&&eL.message||eL)); } catch(_9){} }
  }
  try { document.addEventListener('visibilitychange',()=>{ if(!document.hidden && ME){ fetchState().then(renderAll); } }); } catch(_10){}
})();

/* ============ 权限与上限工具 ============ */
function canDirect(item){ if(ME.role==='admin')return true; if(ME.role==='elder'&&(ME.directDims||[]).includes(item.dim))return true; return false; }
function canDeclare(){ return ME.role==='admin' || (ME.role==='elder'&&ME.canDeclare); }
function parseCap(freq){ if(!freq)return null; let period=null,max=null;
  if(/每日1次|每餐1次|每课1次/.test(freq)){period='day';max=freq.includes('每餐')?3:1;}
  if(/日上限(\d+)/.test(freq)){period='day';max=parseInt(freq.match(/日上限(\d+)/)[1],10);}
  if(/每周(上限)?1次/.test(freq)){period='week';max=1;}
  if(/每周上限(\d+)/.test(freq)){period='week';max=parseInt(freq.match(/每周上限(\d+)/)[1],10);}
  return period?{period,max}:null; }
function capUnit(freq){ const m=freq&&freq.match(/(次|组|页|首)/); return m?m[1]:'次'; }
function usedOf(item){ if(!STATE)return 0; const cap=parseCap(item.freq); if(!cap)return 0;
  const now=new Date();
  return STATE.records.filter(r=>{ if(r.item!==item.name||r.status==='rejected')return false; const d=new Date(r.ts);
    if(cap.period==='day')return d.toDateString()===now.toDateString();
    const wd=x=>{const y=new Date(x);const day=(y.getDay()+6)%7;y.setDate(y.getDate()-day);return y.toDateString();};
    return wd(d)===wd(now); }).reduce((s,r)=>s+(r.qty||1),0); }
function totalGained(){ let s=0; if(!STATE)return 0; (STATE.records||[]).forEach(r=>{if(!r.void&&r.status==='confirmed'&&r.type==='add')s+=r.score;}); return s; }
function totalDeducted(){ let s=0; if(!STATE)return 0; (STATE.records||[]).forEach(r=>{if(!r.void&&r.status==='confirmed'&&r.type==='sub')s+=Math.abs(r.score);}); return s; }
function totalExchanged(){ let s=0; if(!STATE)return 0; (STATE.exchanges||[]).forEach(x=>{if(x.status==='approved')s+=x.cost;}); return s; }
function totalPendingEx(){ let s=0; if(!STATE)return 0; (STATE.exchanges||[]).forEach(x=>{if(x.status==='pending')s+=x.cost;}); return s; }
function nextReward(){ let all=[]; (RULES.exchange||[]).forEach(g=>(g.items||[]).forEach(i=>all.push(i))); return all.find(i=>STATE.total<i.cost)||all[all.length-1]||{name:'攒一个大目标',cost:9999}; }
function exchangeProgress(cost){ return Math.min(100, Math.floor(STATE.total/cost*100)); }

function layerLabel(d){

function stampNow(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
async function exportData(){
  try{
    const d=await call('/api/export');
    const blob=new Blob([JSON.stringify({ exportedAt:d.exportedAt, state:d.state, accounts:d.accounts, rules:d.rules, audit:d.audit },null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='椰子小超人银行-备份-'+stampNow()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1200);
    toast('备份文件已下载 ✅');
  }catch(e){ toast('导出失败：'+e.message); }
}
async function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    const txt=await f.text();
    const j=JSON.parse(txt);
    const s=(j&&j.state)?j.state:j;
    if(!s||typeof s.total!=='number'||!Array.isArray(s.records)) throw new Error('这不是本系统的备份文件');
    if(!confirm('将恢复备份中的密码，并把备份记录与当前记录合并（不覆盖现有数据）。\n当前总分：'+STATE.total+' 分\n备份总分：'+s.total+' 分（'+s.records.length+' 条记录）\n确定要合并恢复吗？')){ input.value=''; return; }
    const r=await call('/api/import',{state:s, accounts:j.accounts});
    await fetchState(); renderAll(); renderAdmin();
    toast('已恢复 ✅ 当前总分 '+r.total+' 分');
  }catch(e){ toast('导入失败：'+e.message); }
  input.value='';
}

  call('/api/rules/save',{rules:Object.assign({},RULES,{items:editRules.items})}).then(()=>{

// 恢复缺失的默认项目：把出厂计分卡里被误删的项目（如勇气类卡片）和扣分卡/兑换清单补回来，自定义项目保留
function mergeDefaultRules(){
  const base=JSON.parse(JSON.stringify(EMBED_RULES));
  const merged=Object.assign({},RULES);
  if(!Array.isArray(merged.dim)||!merged.dim.length) merged.dim=base.dim;
  if(!Array.isArray(merged.items)) merged.items=[];
  if(!Array.isArray(merged.deduct)||!merged.deduct.length) merged.deduct=base.deduct;
  if(!Array.isArray(merged.exchange)||!merged.exchange.length) merged.exchange=base.exchange;
  // 维度也要补全：否则补回的项目会因「所属维度不存在」保存失败
  const dk=new Set(merged.dim.map(d=>d.key));
  merged.dim=merged.dim.concat(base.dim.filter(d=>!dk.has(d.key)));
  const have=new Set(merged.items.map(i=>i.name));
  merged.items=merged.items.concat(base.items.filter(i=>!have.has(i.name)));
  return merged;
}

  RULES=mergeDefaultRules();

    await call('/api/rules/save',{rules:RULES});

function remindersBlock(guest){
  const items=[
    ['a','情绪优先于积分：','如果孩子正在哭、发脾气、明显受挫，请先拥抱和共情，这一刻不要扣分、也不要急着加分。情绪稳定后，再回顾"刚才哪里可以做得更好"。'],
    ['b','睡眠和运动是根基：','起床拖拉、注意力不集中，先检查昨晚睡了多久、今天有没有跑跳够。很多"行为问题"其实是身体信号。'],
    ['c','勇气不能靠施压：','害羞、不敢当众发言、没竞选班干部，这些都是孩子当下的真实状态。我们可以创造安全的小机会鼓励他去尝试，但不要为了"得分"而逼他，更不要扣分。'],
    ['d','保留内在兴趣：','像拼积木这种他已经很热爱、很专注的事，不建议事事都加分。积分是辅助，别把天生的热爱变成"为了奖励才做"的交易。'],
    ['e','每周一次复盘：','全家一起花 5～10 分钟看看本周金币怎么来的、换了什么奖励、下周想挑战哪一项。复盘比分数更重要。'],
  ];
  return `<div class="guide-card" style="margin-bottom:10px;">
    <h3>🧭 日常使用的 5 个提醒</h3>`+
    items.map(([n,b,full])=>`<p><span class="num">${n}</span><b>${b}</b>${guest?'':full}</p>`).join('')+
    `</div>`;
}
function guideHTML(guest){
  return `<div class="guide-card"><h3>📖 致家里的每一位大人 · 积分银行使用共识</h3>
    <p style="font-size:12px;color:var(--sub);margin:-4px 0 12px;">（给爸爸、妈妈、外公、外婆、爷爷、奶奶）</p>

    <p><span class="num">1</span><b>我们是一支队伍：</b>椰子小超人银行不是"谁管孩子"的工具，而是<strong>全家统一标准的记事本</strong>。对孩子来说，最困惑的往往不是要求高，而是<strong>家里标准不一</strong>——在父母这里要学着自理，到了长辈那里却被包办代劳，他会茫然"到底该照着谁做"。所以第一条共识是：<strong>规则全家一起定、一起守，谁都不偷偷破例。</strong></p>

    <p><span class="num">2</span><b>科学方法 + 生活经验，本就互补：</b>爸爸妈妈更懂儿童心理与科学方法，知道"先共情再引导""多夸努力少夸聪明"；长辈有更多带孩子的生活阅历，知道孩子什么时候累了、什么小毛病长大就好。二者不冲突：<strong>用科学方法把长辈的经验讲明白，用长辈的威信把科学方法落到实处。</strong>比如长辈在孩子面前有威信，小额加分由他们直接给，既及时又让孩子服气；家人若更习惯"替孩子多做一点"，系统就贴心设计为"先申报、由爸妈确认"，既尊重长辈的心意，也守住了底线的统一。</p>

    <p><span class="num">3</span><b>先看见孩子，再给分：</b>我们的孩子语言表达好、共情能力强，但容易害羞、受挫就想放弃，被夸又容易嘚瑟。积分背后真正要养的，不是分数，而是<strong>"我愿意再试一次"的勇气</strong>。所以每一次加分，请先蹲下来描述他具体做了什么："你自己把积木收回了盒子，这叫负责，+1。"这比"你真棒"管用十倍。</p>

    <p><span class="num">4</span><b>正强化是主菜，扣分只是调味品：</b>操作性条件反射（斯金纳）告诉我们，及时、具体的肯定最能巩固行为。系统里加分项远多于扣分项，扣分也只针对打人、说谎、危险行为等少数底线，分值小、不贴标签，目的是提醒而非羞辱。</p>

    <p><span class="num">5</span><b>用"他喜欢的事"拉动"该做的事"：</b>这就是普雷马克原理（祖母法则）。他爱拼积木、爱和小朋友户外玩，这些不必事事都打分；但可以约定：先把该做的事做完，再痛快地玩。奖励清单建议<strong>每周花 5 分钟和孩子一起修订</strong>，让他有参与感和自主感（自我决定理论）。</p>

    <p><span class="num">6</span><b>小步子、高频反馈，降低受挫感：</b>7 岁孩子的专注力还在发展中，目标要"跳一跳够得着"。小奖励当天就能换，中奖励攒几天，大奖励留到周末或月末。每一次小成功，都在帮他练习延迟满足，也在缓冲"一受挫就放弃"的惯性。</p>

    <p><span class="num">7</span><b>夸努力、夸品格，不夸"聪明"：</b>成长型思维（德韦克）告诉我们，夸"聪明"会让孩子怕失败；夸"努力、负责、坚持"，他才会相信能力可以通过练习变强。对他这样被夸易嘚瑟、受挫易沮丧的孩子，这一点尤其重要。</p>
  </div>
  ${remindersBlock(guest)}
  <div class="guide-card" style="margin-bottom:20px;">
    <h3>⚠️ 专业边界：什么时候要寻求线下帮助</h3>
    <p style="font-size:13px;line-height:1.7;margin-bottom:8px;">积分系统只是家庭辅助工具，不能替代专业评估。如果出现以下情况，建议到正规医院<strong>儿童发育行为儿科 / 儿童心理科</strong>咨询：</p>
    <p>• 持续 2 周以上情绪低落、拒绝上学、严重回避社交；</p>
    <p>• 睡眠问题持续数月，已经明显影响白天状态；</p>
    <p>• 注意力涣散、坐不住不仅在家庭里，在学校、兴趣班等所有场合都持续明显；</p>
    <p>• 打人、说谎等行为反复出现且口头引导完全无效。</p>
    <p>早发现、早支持，不是给孩子贴标签，而是给他更合适的成长帮助。</p>
  </div>`;
}

/* ============ 规则页：六大板块分值说明 + 家长须知 ============ */
function renderRules(){
  const box=document.getElementById('view-rules'); if(!box)return;
  const tabs=['分值说明','家长须知'];
  let html=`<div class="dim-tabs" style="padding-top:10px;">`+tabs.map(t=>`<div class="dim-tab ${rulesTab===t?'on':''}" onclick="rulesTab='${t}';renderRules()">${t}</div>`).join('')+`</div>`;
  if(rulesTab==='家长须知'){ box.innerHTML=html+guideHTML(GUEST); return; }
  // 分值说明汇总：按六大维度罗列
  html+=RULES.dim.map(d=>{
    const items=RULES.items.filter(i=>i.dim===d.key);
    return `<div class="sec-head"><span class="e">${dimEmo(d.key)}</span><div><div class="t" style="color:${d.color}">${dimName(d)}</div><div class="s">${layerLabel(d)} · 共 ${items.length} 项</div></div></div>`
      + items.map(it=>`<div class="rule-item" style="background:#fff;border-radius:14px;padding:10px 12px;margin:0 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.04);">
          <div class="nm">${emoFor(it.name)} ${it.name} <span style="color:#16A34A;">+${it.score}</span></div>
          <div class="meta">${it.freq||''}${it.op?' · '+it.op:''}</div>${it.desc?`<div class="desc">${it.desc}</div>`:''}${it.eg?`<div class="desc">例：${it.eg}</div>`:''}
        </div>`).join('');
  }).join('');
  // 扣分说明
  html+=`<div class="sec-head"><span class="e">💧</span><div><div class="t" style="color:#EF4444">温柔扣分</div><div class="s">仅针对少数底线行为 · 共 ${(RULES.deduct||[]).length} 项</div></div></div>`
    + (RULES.deduct||[]).map(d=>`<div class="rule-item" style="background:#fff;border-radius:14px;padding:10px 12px;margin:0 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.04);">
        <div class="nm">${d.icon||'💧'} ${d.name} <span style="color:#DC2626;">${d.score}</span></div>
        ${d.desc?`<div class="desc">${d.desc}</div>`:''}
      </div>`).join('');
  html+=`<div style="height:10px;"></div>`;
  box.innerHTML=html;
}

/* ============ 详情弹窗 ============ */
function openDetailItem(name){
  if(GUEST){ guestHint(); return; }
  const it=RULES.items.find(i=>i.name===name); if(!it)return;
  const cap=parseCap(it.freq); const used=usedOf(it); const remain=cap?cap.max-used:Infinity;
  const authorized=canDeclare();
  const direct=canDirect(it);
  document.getElementById('detName').textContent=it.name;
  const detLines=[`${emoFor(it.name)} 分值：+${it.score} 金币`, `频次：${it.freq}`];
  if(it.desc) detLines.push(it.desc);
  if(it.eg) detLines.push('示例：'+it.eg);
  if(cap) detLines.push(`本${cap.period==='day'?'日':'周'}已用 ${used}/${cap.max}${capUnit(it.freq)}`);
  document.getElementById('detDesc').innerHTML=detLines.join('<br>');
  document.getElementById('detBody').innerHTML='';
  const actions=document.getElementById('detActions');
  if(ME.role==='kid'){
    actions.innerHTML=`<button class="btn-gold" style="flex:1;" onclick="submitRemind('${it.name}')">我做到了，请大人帮我加分</button>`;
  } else if(authorized && remain>0){
    const label=direct?(ME.role==='admin'?'直接加分':'直接加分'):'提交申报';
    actions.innerHTML=`<button class="btn-primary" style="flex:1;" onclick="closeSheet();openScoreByName('${it.name}')">${label}</button>`;
  } else {
    actions.innerHTML=`<button class="btn-ghost" style="flex:1;" onclick="closeSheet()">关闭</button>`;
  }
  document.getElementById('detailMask').classList.add('on');
}
function openDetailDeduct(name){
  if(GUEST){ guestHint(); return; }
  const d=(RULES.deduct||[]).find(x=>x.name===name); if(!d)return;
  document.getElementById('detName').textContent=d.name;
  document.getElementById('detDesc').innerHTML=`${d.icon} 扣分：${d.score} 金币<br>${d.desc}`;
  document.getElementById('detBody').innerHTML='';
  const actions=document.getElementById('detActions');
  if(ME.role==='admin') actions.innerHTML=`<button class="btn-red" style="flex:1;" onclick="closeSheet();openDeductByName('${d.name}')">登记扣分</button>`;
  else if(ME.role==='elder') actions.innerHTML=`<button class="btn-red" style="flex:1;" onclick="closeSheet();openDeductByName('${d.name}')">提交扣分申请</button>`;
  else actions.innerHTML=`<button class="btn-ghost" style="flex:1;" onclick="closeSheet()">关闭</button>`;
  document.getElementById('detailMask').classList.add('on');
}
function closeDetail(e){ if(e.target.id==='detailMask') document.getElementById('detailMask').classList.remove('on'); }

/* ============ 计分弹窗 ============ */
let ss={idx:null,val:null,qty:1,subs:[],rope:{cont:'',one:''}};
function openScoreByName(name){ const idx=RULES.items.findIndex(i=>i.name===name); if(idx>=0) openScore(idx); }
function openScore(idx){
  const it=RULES.items[idx]; ss={idx,val:null,qty:1,subs:[],rope:{cont:'',one:''}};
  document.getElementById('ssName').textContent=it.name;
  document.getElementById('ssDesc').textContent=[it.freq,it.desc].filter(Boolean).join(' · ');
  const optBox=document.getElementById('ssOpt'); const subsBox=document.getElementById('ssSubs');
  const ropeBox=document.getElementById('ssRope'); const qtyBox=document.getElementById('ssQty');
  optBox.innerHTML=''; subsBox.innerHTML=''; ropeBox.classList.add('hidden'); qtyBox.classList.add('hidden');
  if(it.mode==='复合'){
    ss.subs=it.subs.map(()=>null);
    subsBox.innerHTML=it.subs.map((s,i)=>`<div class="subrow"><div class="sl">${s.label}</div><div class="sopts">${s.opts.map(o=>`<button onclick="pickSub(${i},${o},this)">${o}分</button>`).join('')}</div></div>`).join('');
  } else if(it.special==='rope'){
    ropeBox.classList.remove('hidden');
    const prev=[...(STATE.records||[])].reverse().find(r=>r.item===it.name&&r.remarks);
    document.getElementById('ssRopeHint').textContent=prev?`上次：连续 ${prev.remarks.cont} / 1分钟 ${prev.remarks.one}（≥上次各+1分）`:'首次完成即得 2 分（保底）';
  } else if(it.mode==='质量'&&it.opts){
    optBox.innerHTML=it.opts.map(o=>`<button onclick="pickOpt(this,${o[1]})">${o[0]}（${o[1]}分）</button>`).join('');
  } else {
    const fixed=parseInt(it.score.replace('~',''),10);
    optBox.innerHTML=`<button class="sel" onclick="pickOpt(this,${fixed})">+${it.score} 分</button>`; ss.val=fixed;
  }
  if(/可累计/.test(it.freq) && it.special!=='rope' && it.mode!=='复合'){
    qtyBox.classList.remove('hidden');
    const cap=parseCap(it.freq); const used=usedOf(it);
    const remain=cap?Math.max(0,cap.max-used):10; ss.qty=1;
    document.getElementById('ssQtyN').textContent='1';
    document.getElementById('ssQtyHint').textContent=cap?`（本${cap.period==='day'?'日':'周'}剩 ${remain}${capUnit(it.freq)}）`:'';
  }
  document.getElementById('ssReason').value='';
  document.getElementById('ssReason').placeholder='必填：做了什么 / 具体事例（如：'+(it.eg||'跳绳138个，超过上次')+'）';
  document.getElementById('scoreMask').classList.add('on');
}
function chgQty(d){ const it=RULES.items[ss.idx]; const cap=parseCap(it.freq); const used=usedOf(it);
  const maxQ=cap?Math.max(1,cap.max-used):20; ss.qty=Math.min(maxQ,Math.max(1,ss.qty+d));
  document.getElementById('ssQtyN').textContent=ss.qty; }
function pickOpt(el,v){ document.querySelectorAll('#ssOpt button').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); ss.val=v; }
function pickSub(i,v,el){ el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); ss.subs[i]=v; }
function closeSheet(e){ if(e && e.target!==e.currentTarget) return; document.querySelectorAll('.mask').forEach(m=>m.classList.remove('on')); }
async function submitScore(){
  const it=RULES.items[ss.idx]; const reason=document.getElementById('ssReason').value.trim();
  let score=null;
  if(it.mode==='复合'){ if(ss.subs.some(x=>x===null)){ toast('请为每项行为打分'); return; } score=ss.subs.reduce((a,b)=>a+b,0); }
  else if(it.special==='rope'){ const cont=document.getElementById('ssRopeCont').value, one=document.getElementById('ssRopeOne').value;
    if(cont===''||one===''){ toast('请填写两项数量备注'); return; } ss.rope={cont,one};
    const prev=[...STATE.records].reverse().find(r=>r.item===it.name&&r.remarks); let s=it.floor||2;
    if(prev&&prev.remarks){ if(Number(cont)>=Number(prev.remarks.cont))s+=1; if(Number(one)>=Number(prev.remarks.one))s+=1; } score=Math.min(4,Math.max(it.floor||2,s)); }
  else { if(ss.val===null){ toast('请先选择得分档位'); return; } score=ss.val; }
  if(!reason){ toast('请填写原因（做了什么/具体事例）'); return; }
  const cap=parseCap(it.freq);
  if(cap&&it.mode!=='复合'&&it.special!=='rope'){ const used=usedOf(it); if(used+ss.qty>cap.max){ toast(`「${it.name}」本${cap.period==='day'?'日':'周'}上限 ${cap.max}${capUnit(it.freq)}，已用 ${used}`); return; } }
  const payload={ item:it.name, score, qty:ss.qty, reason, subs:ss.subs, cont:ss.rope.cont, one:ss.rope.one };
  try{ const d=await call('/api/record',payload); closeSheet();
    await fetchState(); renderAll();
    if(d.notice) toast(d.notice);
    else if(d.status==='confirmed'){ toast(`已加分 +${score*ss.qty} ✅`); sparkle(); } else toast('已提交申报，等爸妈确认 📝');
  }catch(e){ toast(e.message||'提交失败'); }
}

async function rejectRec(id){ try{ await call('/api/confirm',{recId:id,approve:false}); await fetchState(); renderAll(); toast('已驳回'); }catch(e){ toast(e.message); } }
async function confirmEx(id){ try{ await call('/api/exchangeConfirm',{recId:id,approve:true}); await fetchState(); renderAll(); toast('已批准 🎁'); }catch(e){ toast(e.message); } }
async function rejectEx(id){ try{ await call('/api/exchangeConfirm',{recId:id,approve:false}); await fetchState(); renderAll(); toast('已驳回，积分已加回'); }catch(e){ toast(e.message); } }
async function toggleDeclare(id){ const cur=ACCOUNTS.find(a=>a.id===id); try{ const d=await call('/api/account',{id,canDeclare:!cur.canDeclare}); syncAccts(d.accounts); renderAdmin(); toast('已更新 '+id+' 授权'); }catch(e){ toast(e.message); } }
async function toggleDim(id,dim){ const cur=ACCOUNTS.find(a=>a.id===id)||{directDims:[]}; let dd=cur.directDims?cur.directDims.slice():[]; if(dd.includes(dim))dd=dd.filter(x=>x!==dim); else dd.push(dim);
  try{ const d=await call('/api/account',{id,directDims:dd}); syncAccts(d.accounts); renderAdmin(); toast('已更新 '+id+' 权限'); }catch(e){ toast(e.message); } }
function syncAccts(arr){ arr.forEach(a=>{ const cur=ACCOUNTS.find(x=>x.id===a.id); if(cur){ cur.directDims=a.directDims||[]; cur.canDeclare=a.canDeclare; } }); if(MODE==='local')Local.saveAccts(ACCOUNTS); if(ME){ const m=arr.find(a=>a.id===ME.id); if(m){ ME.directDims=m.directDims||[]; ME.canDeclare=m.canDeclare; } } }
async function resetPin(id){ const a=ACCOUNTS.find(x=>x.id===id); const np=prompt('为「'+(a?a.name:id)+'」设置新密码（4位数字）：'); if(np===null)return; if(!/^\d+$/.test(np)||np.length<4){ toast('密码需为至少4位数字'); return; }
  try{ await call('/api/account',{id,pin:np}); toast('密码已重置'); }catch(e){ toast(e.message); } }
async function setCarer(c){ try{ await call('/api/carer',{carer:c}); await fetchState(); renderAdmin(); toast('带娃备注：'+c); }catch(e){ toast(e.message); } }

function openMenu(){ if(!ME)return; document.getElementById('menuName').textContent=ME.name; document.getElementById('menuRole').textContent=ME.role==='admin'?'管理员':ME.role==='kid'?'宝宝':'长辈';
  // 宝宝账号不给改密码入口（避免孩子把家长锁在门外），由管理员在管理页重置
  const pb=document.getElementById('menuPinBtn'); if(pb) pb.style.display=(ME.role==='kid')?'none':'';
  document.getElementById('menuMask').classList.add('on'); }
async function changeMyPin(){
  if(!ME) return;
  const oldPin=prompt('请输入当前密码（4位数字）：'); if(oldPin===null)return;
  const np=prompt('请输入新密码（4位数字）：'); if(np===null)return;
  if(!/^\d{4,}$/.test(np)){ toast('新密码需为至少 4 位数字'); return; }
  const np2=prompt('请再输入一次新密码：'); if(np2===null)return;
  if(np!==np2){ toast('两次输入的新密码不一致'); return; }
  try{ await call('/api/mypin',{oldPin,newPin:np}); toast('密码已修改 ✅ 下次登录请用新密码'); }
  catch(e){ toast(e.message||'修改失败'); }
}
function showBanner(msg){ let b=document.querySelector('.banner'); if(!b){ b=document.createElement('div'); b.className='banner'; document.body.appendChild(b); } b.textContent=msg; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800); }
function sparkle(){ for(let i=0;i<8;i++){ const s=document.createElement('div'); s.className='sparkle'; s.textContent='⭐'; s.style.left=(Math.random()*80+10)+'vw'; s.style.top=(Math.random()*40+20)+'vh'; document.body.appendChild(s); setTimeout(()=>s.remove(),900); } }
</script>
